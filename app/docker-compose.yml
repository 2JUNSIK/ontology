# Ontology Builder — 로컬 Neo4j (v2)
# 기존 다른 스택(genesis/cvat 등)과 충돌하지 않도록
# 프로젝트명(name)·컨테이너명·볼륨명을 모두 ontology 계열로 분리한다.
name: ontology-builder

services:
  neo4j:
    image: neo4j:5-community          # 로컬에 이미 캐시된 이미지 (재다운로드 불필요)
    container_name: ontology-neo4j
    ports:
      - "7474:7474"                   # HTTP (Neo4j Browser)
      - "7687:7687"                   # Bolt (python driver)
    environment:
      # 최초 기동 시의 계정/비밀번호가 볼륨에 저장된다.
      # 비밀번호를 바꾸려면 볼륨을 삭제(docker compose down -v)하고 재기동할 것.
      # NEO4J_PASSWORD는 같은 폴더의 .env에서 읽으며, 없으면 기본값을 사용한다.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-ontology_dev_pw}"
    volumes:
      - ontology_neo4j_data:/data
      - ontology_neo4j_logs:/logs
    healthcheck:
      # neo4j 이미지에 번들된 cypher-shell로 Bolt 접속 가능 여부 확인
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"${NEO4J_PASSWORD:-ontology_dev_pw}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  ontology_neo4j_data:
    name: ontology_neo4j_data
  ontology_neo4j_logs:
    name: ontology_neo4j_logs
